{% extends "base.html" %}
{% block title %}Usuarios &mdash; FaceSec{% endblock %}
{% block content %}
<div class="grid">
  <section class="feed-panel">
    <h2>CREAR USUARIO DE PANEL</h2>
    <form method="POST" style="max-width:320px;">
      <label>USUARIO</label>
      <input type="text" name="username" required
             style="width:100%; background:#0d1416; color:var(--text); border:1px solid var(--accent-dim); padding:8px; margin:4px 0 12px;">
      <label>CONTRASEÑA</label>
      <input type="password" name="password" required
             style="width:100%; background:#0d1416; color:var(--text); border:1px solid var(--accent-dim); padding:8px; margin:4px 0 12px;">
      <label>ROL</label>
      <select name="role" style="width:100%; background:#0d1416; color:var(--text); border:1px solid var(--accent-dim); padding:8px; margin:4px 0 12px;">
        <option value="viewer" selected>viewer (solo ver)</option>
        <option value="admin">admin (control total)</option>
      </select>
      <button type="submit">CREAR USUARIO</button>
    </form>
  </section>

  <section class="log-panel">
    <h2>USUARIOS EXISTENTES</h2>
    <ul id="event-log">
      {% for u in users %}
      <li>{{ u.username }} &mdash; {{ u.role }} &mdash; desde {{ u.created_at }}</li>
      {% endfor %}
    </ul>
  </section>
</div>
{% endblock %}
